<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  
  <!-- 背景深色圆角容器 -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#1E293B" stroke-width="1"/>
  
  <!-- 外圈网络球 -->
  <circle cx="32" cy="32" r="22" stroke="url(#globeGrad)" stroke-width="2"/>
  
  <!-- 经度椭圆 -->
  <ellipse cx="32" cy="32" rx="11" ry="22" stroke="url(#globeGrad)" stroke-width="1.6" stroke-opacity="0.85"/>
  
  <!-- 中心纬线与经线 -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="url(#globeGrad)" stroke-width="1.6"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="url(#globeGrad)" stroke-width="1.6"/>
  
  <!-- 纬度椭圆 -->
  <ellipse cx="32" cy="32" rx="22" ry="10" stroke="url(#globeGrad)" stroke-width="1.4" stroke-opacity="0.65" stroke-dasharray="2 1.5"/>
  
  <!-- 拓扑连接节点 -->
  <circle cx="32" cy="32" r="2.8" fill="#38BDF8"/>
  <circle cx="32" cy="10" r="1.8" fill="#38BDF8"/>
  <circle cx="32" cy="54" r="1.8" fill="#38BDF8"/>
  <circle cx="10" cy="32" r="1.8" fill="#38BDF8"/>
  <circle cx="54" cy="32" r="1.8" fill="#38BDF8"/>
  <circle cx="21" cy="32" r="1.8" fill="#38BDF8"/>
  <circle cx="43" cy="32" r="1.8" fill="#38BDF8"/>
</svg>
