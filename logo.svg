<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logoGlobeGrad" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="logoBgGrad" x1="5" y1="5" x2="55" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  
  <!-- 图标容器 -->
  <g transform="translate(5, 5)">
    <rect width="50" height="50" rx="12" fill="url(#logoBgGrad)"/>
    <rect x="0.5" y="0.5" width="49" height="49" rx="11.5" stroke="#1E293B" stroke-width="1"/>
    
    <!-- 拓扑网络球体 -->
    <circle cx="25" cy="25" r="17" stroke="url(#logoGlobeGrad)" stroke-width="1.8"/>
    <ellipse cx="25" cy="25" rx="8.5" ry="17" stroke="url(#logoGlobeGrad)" stroke-width="1.4" stroke-opacity="0.85"/>
    <line x1="25" y1="8" x2="25" y2="42" stroke="url(#logoGlobeGrad)" stroke-width="1.4"/>
    <line x1="8" y1="25" x2="42" y2="25" stroke="url(#logoGlobeGrad)" stroke-width="1.4"/>
    <ellipse cx="25" cy="25" rx="17" ry="7.5" stroke="url(#logoGlobeGrad)" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="2 1.5"/>
    
    <!-- 节点 -->
    <circle cx="25" cy="25" r="2.2" fill="#38BDF8"/>
    <circle cx="25" cy="8" r="1.5" fill="#38BDF8"/>
    <circle cx="25" cy="42" r="1.5" fill="#38BDF8"/>
    <circle cx="8" cy="25" r="1.5" fill="#38BDF8"/>
    <circle cx="42" cy="25" r="1.5" fill="#38BDF8"/>
    <circle cx="16.5" cy="25" r="1.5" fill="#38BDF8"/>
    <circle cx="33.5" cy="25" r="1.5" fill="#38BDF8"/>
  </g>
  
  <!-- 品牌文字 -->
  <text x="68" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#09090B" letter-spacing="-0.02em">
    tizi<tspan fill="#0284C7">VPN</tspan>
  </text>
  <text x="68" y="45" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.1em">
    GLOBAL NETWORK REPORT
  </text>
</svg>
